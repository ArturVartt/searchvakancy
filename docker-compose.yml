services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-searchvakancy}
      POSTGRES_USER: ${POSTGRES_USER:-searchvakancy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searchvakancy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-searchvakancy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD:-searchvakancy}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: celery -A config worker -l info
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD:-searchvakancy}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD:-searchvakancy}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    volumes:
      - ./frontend:/app
      - /app/node_modules # не перекрывать node_modules контейнера хостовым (пустым/чужой ОС) volume
    ports:
      - "5173:5173"
    depends_on:
      - backend

  telegram_bot:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: python manage.py runbot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD:-searchvakancy}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - telegram  # не поднимается по `docker compose up` без --profile telegram

volumes:
  pgdata:
