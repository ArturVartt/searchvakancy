services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-searchvakancy}
      POSTGRES_USER: ${POSTGRES_USER:-searchvakancy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-searchvakancy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    entrypoint: ["sh", "docker-entrypoint.prod.sh"]
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_prod:/app/staticfiles
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуем — заходим через nginx во фронтенд-контейнере.

  celery_worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config worker -l info --concurrency=4
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram_bot:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: python manage.py runbot
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-searchvakancy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-searchvakancy}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - telegram

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (домен, на который выпускаем TLS-сертификат)}
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend

  # Только продление уже выпущенного сертификата по крону — сам выпуск
  # (в т.ч. самый первый) делает init-letsencrypt.sh, см. README.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done;'

volumes:
  pgdata_prod:
  static_prod:
  media_prod:
